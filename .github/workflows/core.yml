name: Canopy core

on:
  push:
    paths: ["core/**", "deploy/demo/**", "docker-compose.demo.yml", ".dockerignore", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "deploy/demo/**", "docker-compose.demo.yml", ".dockerignore", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: core/requirements.lock
      - run: python -m pip install -r core/requirements.lock
      - run: python -m pip install -e "core[dev,models]"
      - run: python -m pip check
      - name: Install isolated Pollard-Jev package for contract tests
        run: |
          python -m venv .canopy/pollard-jev-env
          .canopy/pollard-jev-env/bin/python -m pip install -r core/requirements-pollard-jev.txt
          .canopy/pollard-jev-env/bin/python -m pip check
      - run: python -m ruff check core deploy/demo
      - run: python -m pytest core/tests -q
        env:
          CANOPY_TEST_POLLARD_JEV_PYTHON: ${{ github.workspace }}/.canopy/pollard-jev-env/bin/python
      - run: python core/scripts/component_smoke.py
