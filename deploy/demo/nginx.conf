server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Generated immediately before demo startup, independently of the web build.
    location = /recordings/core-task.json {
        alias /demo-fixtures/core-task.json;
        add_header Cache-Control "no-store" always;
    }
    location = /recordings/core-synthetic.json {
        alias /demo-fixtures/core-synthetic.json;
        add_header Cache-Control "no-store" always;
    }
    # Other frontend-owned recordings, including the advisor demo, ship with
    # the static bundle and must not be hidden by the fresh fixture volume.
    location /recordings/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /proof { return 301 /proof/; }
    location /proof/ {
        alias /usr/share/nginx/proof/;
        autoindex on;
        add_header Cache-Control "no-cache" always;
    }
    location = /evidence { return 302 /proof/examples/recordings/; }
    location = /evidence/ { return 302 /proof/examples/recordings/; }

    location = /generated { return 301 /generated/; }
    location = /generated/index.html { return 302 /proof/examples/recordings/; }
    location = /docs/messaging.md { return 302 /proof/docs/messaging.md; }
    location /generated/ {
        alias /generated/;
        autoindex on;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
