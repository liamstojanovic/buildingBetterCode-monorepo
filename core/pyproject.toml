[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-core"
version = "0.1.0"
description = "Governed execution and validity-aware reuse for enterprise agents"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pollard==1.6.2",
  "chronofy==0.1.9",
  "epicormic==0.1.0",
  "cbor-ld-ex==0.2.1",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]
openai = ["openai>=1.60,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B"]
